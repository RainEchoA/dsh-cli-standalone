name: daily-version-scan

on:
  schedule:
    - cron: '0 13 * * *' # 每天 21:00（北京时间）
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # 用于在 npm latest / next 通道出现新版本时 dispatch release 工作流

env:
  NODE_VERSION: 24.22.2

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan npm dist-tags of @deepseek-ai/dsh
        id: scan
        run: |
          channels=$(node scripts/scan-latest-version.mjs --json)
          latest=$(printf '%s' "$channels" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).latest')
          next=$(printf '%s' "$channels" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).next ?? ""')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - name: Decide action
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="${{ steps.scan.outputs.latest }}"
          next="${{ steps.scan.outputs.next }}"
          current=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null | sed 's/^v//' || true)

          # latest 通道：对齐 npm dist-tag `latest`（npm install 默认安装的版本）。
          # 已发布过该 tag（例如重跑）则不重复动作。
          stable_action=none
          if [ "$latest" != "$current" ] && ! gh api "repos/${{ github.repository }}/releases/tags/v$latest" >/dev/null 2>&1; then
            stable_action=release
          fi

          # next 通道：对齐 npm dist-tag `next`（npm install @next 的预发布版本），
          # 作为 GitHub prerelease 自动同步，不再只开跟踪 issue 等人工确认。
          next_action=none
          if [ -n "$next" ] && ! gh api "repos/${{ github.repository }}/releases/tags/v$next" >/dev/null 2>&1; then
            next_action=release
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "stable_action=$stable_action" >> "$GITHUB_OUTPUT"
          echo "next_action=$next_action" >> "$GITHUB_OUTPUT"
          echo "npm latest=$latest next=${next:-（无）} standalone=${current:-（尚无）} stable_action=$stable_action next_action=$next_action" >> "$GITHUB_STEP_SUMMARY"
      - name: Trigger release for new latest version
        if: steps.compare.outputs.stable_action == 'release'
        id: trigger-stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.compare.outputs.latest }}"
          gh workflow run release -R "${{ github.repository }}" -f "version=$version"
          sleep 5
          run_url=$(gh run list -R "${{ github.repository }}" --workflow release --limit 1 --json url --jq '.[0].url')
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "已触发 v$version（npm latest）发布：$run_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Trigger release for new next version
        if: steps.compare.outputs.next_action == 'release'
        id: trigger-next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.compare.outputs.next }}"
          gh workflow run release -R "${{ github.repository }}" -f "version=$version"
          sleep 5
          run_url=$(gh run list -R "${{ github.repository }}" --workflow release --limit 1 --json url --jq '.[0].url')
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "已触发 v$version（npm next）发布：$run_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update notification issue
        if: steps.compare.outputs.stable_action == 'release' || steps.compare.outputs.next_action == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="${{ steps.compare.outputs.latest }}"
          next="${{ steps.compare.outputs.next }}"
          current="${{ steps.compare.outputs.current }}"
          stable_action="${{ steps.compare.outputs.stable_action }}"
          next_action="${{ steps.compare.outputs.next_action }}"
          stable_run_url="${{ steps.trigger-stable.outputs.run_url }}"
          next_run_url="${{ steps.trigger-next.outputs.run_url }}"
          gh label create version-scan --force --color BFD4F2 --description "上游 dsh 新版本跟踪" >/dev/null 2>&1 || true
          if [ "$stable_action" = "release" ]; then
            latest_line="- npm \`latest\`：\`$latest\`（已触发发布：$stable_run_url）"
          else
            latest_line="- npm \`latest\`：\`$latest\`（standalone 已发布）"
          fi
          if [ "$next_action" = "release" ]; then
            next_line="- npm \`next\`：\`$next\`（已触发预发布：$next_run_url）"
          elif [ -n "$next" ]; then
            next_line="- npm \`next\`：\`$next\`（standalone 已发布）"
          else
            next_line="- npm \`next\`：（上游未设置该 dist-tag）"
          fi
          body=$(cat <<EOF
          定时扫描发现 npm 上有了新的通道版本，已自动触发同步发布。

          $latest_line
          $next_line
          - 本仓库先前 latest release：\`${current:-（尚无）}\`

          发布流水线会完成双平台构建与全部验证；若失败，次日扫描会自动重试。
          EOF
          )
          existing=$(gh issue list --label version-scan --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "已在 issue #$existing 下追加评论" >> "$GITHUB_STEP_SUMMARY"
          else
            title="[scan] 上游 dsh 新版本："
            if [ "$stable_action" = "release" ]; then title="$title$latest"; else title="$title$next"; fi
            gh issue create --title "$title" --label version-scan --body "$body"
            echo "已创建通知 issue" >> "$GITHUB_STEP_SUMMARY"
          fi

# CNB 云原生构建配置
#
# 目标：每天凌晨 3 点（Asia/Shanghai）自动完成三件事
#       1) 把 GitHub 的全部分支 / tag / 完整提交历史镜像到本 CNB 仓库
#       2) 把 GitHub Release 的说明与附件同步到本仓库的 CNB Release
#       3) 用 doc/INSTALL-CNB.md 重新生成 CNB 主页 README.md
#       全程不在 CNB 上执行任何「构建」（仓库「推送自动触发」已关闭）。
#
# - 读取 GitHub 全部使用匿名访问（公开仓库，无需任何 Token / 密钥）。
# - 写入 CNB 使用流水线内置的 CNB_TOKEN（构建结束自动销毁，仅限当前仓库）。
# - 触发方式：
#     crontab 0 3 * * *   每天 03:00 定时（避开 GitHub 21:00 扫描/构建高峰）
#     web_trigger        页面通用按钮
#     web_trigger_sync   页面按钮「立即同步 GitHub 产物」
#     api_trigger        cnb-rs build start -e api_trigger / OPENAPI
#
# 页面按钮配置见 .cnb/web_trigger.yml。
# 社区可参考的实现：
#   - tencentcom/git-sync（代码全量镜像）：https://cnb.cool/cnb/plugins/tencentcom/git-sync
#   - mpgrm（gsync 继任者，Release 同步）：https://cnb.cool/zhiqiangwang/mpgrm
#   - CNB 附件插件：https://cnb.cool/cnb/plugins/cnbcool/attachments

main:
  # ---------------------------------------------------------------- 定时：每天 03:00
  # GitHub 侧 daily-version-scan 每天 21:00（北京时间）启动扫描并可能触发 release 构建，
  # CNB 侧放在 03:00，等 GitHub 构建结束、产物可取后再同步，避免排队。
  "crontab: 0 3 * * *": &sync_pipelines
    - name: sync-from-github
      env:
        GITHUB_SOURCE_REPO: "RainEchoA/dsh-cli-standalone"
        CNB_REPO: "aixx.work/dsh-cli-standalone"
      stages:
        # 1) 代码全量镜像：所有分支 + tag + 完整提交历史
        - name: sync-code-from-github
          image: tencentcom/git-sync
          settings:
            # 拉取模式：从 GitHub 拉取全部分支与标签（含完整提交历史）推送到本 CNB 仓库
            target_url: https://github.com/RainEchoA/dsh-cli-standalone.git
            auth_type: https
            sync_mode: pull
            push_tags: true
            force: true
            # 允许覆盖本地同名标签，保证 CNB 上的 tag 与 GitHub 完全一致
            fetch_options: "--force --prune"
            git_user: cnb-ci
            git_email: cnb-ci@aixx.me

        # 2) Release 产物同步（幂等：附件已存在且大小一致会跳过）
        - name: sync-release
          image: node:22
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            echo "仓库: ${CNB_REPO}  源仓库: ${GITHUB_SOURCE_REPO}"
            node scripts/sync-release.mjs

        # 3) CNB 主页 README（由 doc/INSTALL-CNB.md 生成）
        - name: update-home-readme
          image: node:22
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            node scripts/render-cnb-readme.mjs --doc doc/INSTALL-CNB.md --out README.md
            git add README.md
            if git diff --cached --quiet; then
              echo "CNB 主页 README 无变化，跳过提交"
            else
              # core.hooksPath=/dev/null：绕过仓库自带的 git-lfs hook（node:22 镜像未装 git-lfs）
              git -c core.hooksPath=/dev/null \
                  -c user.name="cnb-ci" -c user.email="cnb-ci@aixx.me" \
                  commit --quiet -m "docs: 更新 CNB 主页 README（由 doc/INSTALL-CNB.md 生成）"
              git -c core.hooksPath=/dev/null push --quiet --force \
                "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git" HEAD:main
              echo "已更新 CNB 主页 README"
            fi

  # ---------------------------------------------------------------- 页面/API 触发
  web_trigger: *sync_pipelines
  web_trigger_sync: *sync_pipelines
  api_trigger: *sync_pipelines

  # 仅刷新主页 README
  web_trigger_readme: &readme_only_pipeline
    - name: update-home-readme-only
      env:
        CNB_REPO: "aixx.work/dsh-cli-standalone"
      stages:
        - name: update-home-readme
          image: node:22
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            node scripts/render-cnb-readme.mjs --doc doc/INSTALL-CNB.md --out README.md
            git add README.md
            if git diff --cached --quiet; then
              echo "CNB 主页 README 无变化，跳过提交"
            else
              git -c core.hooksPath=/dev/null \
                  -c user.name="cnb-ci" -c user.email="cnb-ci@aixx.me" \
                  commit --quiet -m "docs: 更新 CNB 主页 README（由 doc/INSTALL-CNB.md 生成）"
              git -c core.hooksPath=/dev/null push --quiet --force \
                "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git" HEAD:main
              echo "已更新 CNB 主页 README"
            fi

  # 仅同步 Release 产物（不动代码）
  web_trigger_sync_release: &release_only_pipeline
    - name: sync-release-only
      env:
        GITHUB_SOURCE_REPO: "RainEchoA/dsh-cli-standalone"
        CNB_REPO: "aixx.work/dsh-cli-standalone"
      stages:
        - name: sync-release
          image: node:22
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            echo "仓库: ${CNB_REPO}  源仓库: ${GITHUB_SOURCE_REPO}"
            node scripts/sync-release.mjs

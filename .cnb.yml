# CNB 云原生构建配置
#
# 目标：每天凌晨 3 点（Asia/Shanghai）自动完成三件事
#       1) 把 GitHub 的分支 / tag / 完整提交历史镜像到本 CNB 仓库
#       2) 把 GitHub Release 的说明与附件同步到本仓库的 CNB Release
#       3) 在 main 之上生成 CNB 主页 README.md（内容来自 doc/INSTALL-CNB.md）
#       全程不在 CNB 上执行任何「构建」（仓库「推送自动触发」已关闭）。
#
# - 读取 GitHub 全部使用匿名访问（公开仓库，无需任何 Token / 密钥）。
# - 写入 CNB 使用流水线内置的 CNB_TOKEN（构建结束自动销毁，仅限当前仓库）。
# - 代码镜像用 scripts/sync-code-from-github.sh 而不是 tencentcom/git-sync 的 pull 模式：
#   pull 模式内部是 `git pull --rebase`，会把 CNB 侧那条自动生成的
#   「docs: 更新 CNB 主页 README」提交重放到 GitHub 历史之上。README.md 两边内容
#   本就是有意不同的，只要 GitHub 侧动过 README 就必定 CONFLICT，整条流水线失败。
#   改用脚本后，CNB main 恒定重建为「GitHub main + 1 个 README 生成提交」，无分叉、无冲突。
# - 触发方式：
#     crontab 0 3 * * *   每天 03:00 定时（避开 GitHub 21:00 扫描/构建高峰）
#     web_trigger        页面通用按钮
#     web_trigger_sync   页面按钮「立即同步 GitHub 产物」
#     api_trigger        cnb-rs build start -e api_trigger / OPENAPI
#
# 页面按钮配置见 .cnb/web_trigger.yml。
# 社区可参考的实现：
#   - tencentcom/git-sync（push/rebase 模式的跨平台互推）：https://cnb.cool/cnb/plugins/tencentcom/git-sync
#   - mpgrm（gsync 继任者，Release 同步）：https://cnb.cool/zhiqiangwang/mpgrm
#   - CNB 附件插件：https://cnb.cool/cnb/plugins/cnbcool/attachments

main:
  # ---------------------------------------------------------------- 定时：每天 03:00
  # GitHub 侧 daily-version-scan 每天 21:00（北京时间）启动扫描并可能触发 release 构建，
  # CNB 侧放在 03:00，等 GitHub 构建结束、产物可取后再同步，避免排队。
  "crontab: 0 3 * * *": &sync_pipelines
    - name: sync-from-github
      env:
        GITHUB_SOURCE_REPO: "RainEchoA/dsh-cli-standalone"
        CNB_REPO: "aixx.work/dsh-cli-standalone"
        SYNC_MODE: "full"
      stages:
        # 1) 代码镜像 + 主页 README：分支 / tag / 完整提交历史，main 上追加 README 生成提交
        - name: sync-code-from-github
          image: node:22
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            sh scripts/sync-code-from-github.sh

        # 2) Release 产物同步（幂等：附件已存在且大小一致会跳过）
        - name: sync-release
          image: node:22
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            echo "仓库: ${CNB_REPO}  源仓库: ${GITHUB_SOURCE_REPO}"
            node scripts/sync-release.mjs

  # ---------------------------------------------------------------- 页面/API 触发
  web_trigger: *sync_pipelines
  web_trigger_sync: *sync_pipelines
  api_trigger: *sync_pipelines

  # 仅刷新主页 README（不镜像分支与 tag）
  web_trigger_readme:
    - name: update-home-readme-only
      env:
        GITHUB_SOURCE_REPO: "RainEchoA/dsh-cli-standalone"
        CNB_REPO: "aixx.work/dsh-cli-standalone"
        SYNC_MODE: "readme"
      stages:
        - name: update-home-readme
          image: node:22
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            sh scripts/sync-code-from-github.sh

  # 仅同步 Release 产物（不动代码）
  web_trigger_sync_release:
    - name: sync-release-only
      env:
        GITHUB_SOURCE_REPO: "RainEchoA/dsh-cli-standalone"
        CNB_REPO: "aixx.work/dsh-cli-standalone"
      stages:
        - name: sync-release
          image: node:22
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            echo "仓库: ${CNB_REPO}  源仓库: ${GITHUB_SOURCE_REPO}"
            node scripts/sync-release.mjs
